<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="IsoCourt: AI-powered badminton stroke analysis. Upload a clip and get instant pose tracing, stroke scoring, and personalised coaching tips." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="application-name" content="IsoCourt" />
  <title>IsoCourt · AI Badminton Coach</title>

  <!-- Open Graph (defaults; usePageSeo updates per Vite route) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="IsoCourt" />
  <meta property="og:title" content="IsoCourt · AI Badminton Coach" />
  <meta property="og:description"
    content="IsoCourt: AI-powered badminton stroke analysis. Upload a clip and get instant pose tracing, stroke scoring, and personalised coaching tips." />
  <meta property="og:url" content="https://www.isocourt.fit/" />
  <meta property="og:image" content="https://www.isocourt.fit/marketing/pose-trace-hero.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="IsoCourt · AI Badminton Coach" />
  <meta name="twitter:description"
    content="IsoCourt: AI-powered badminton stroke analysis. Upload a clip and get instant pose tracing, stroke scoring, and personalised coaching tips." />
  <meta name="twitter:image" content="https://www.isocourt.fit/marketing/pose-trace-hero.png" />

  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <link rel="canonical" href="https://www.isocourt.fit/" />
  <link rel="preload" href="/fonts/inter/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

  <script>
    (function () {
      var t = localStorage.getItem('isocourt-theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <!-- Paint page color before the CSS bundle so boot never flashes raw white -->
  <style>
    html, body { margin: 0; min-height: 100%; background: #fafafa; }
    html.dark, html.dark body { background: #171717; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
